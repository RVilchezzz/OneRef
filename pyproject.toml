[project]
name = "oneref"
version = "0.1.0"
description = "OneRef: training-free multi-agent visual inspection from a single reference (MMAD, IA025 Unicamp)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy",
    "pillow",
    "scipy",
    "torch",
    "transformers>=4.56",             # DINOv3 visual expert
    "pydantic-ai-slim[openai]>=2.0",  # reader / critic agents (OpenAI-compatible endpoint)
]

[project.optional-dependencies]
logfire = ["logfire"]    # optional telemetry (ONEREF_USE_LOGFIRE=true)

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inspector"]
